name: Rebuild desde la Sheet de productos

# Redeploya el sitio cada ~6h para recoger ediciones que José hizo en la
# Google Sheet de productos (ver .env.example / scripts/check-data.mjs).
# Solo golpea un Vercel Deploy Hook — no corre build acá, no agrega código
# de app: el build real lo hace Vercel.
#
# Setup (una sola vez, junto con "gh repo create" + conectar Vercel):
#   1. En Vercel: Project Settings → Git → Deploy Hooks → crear uno para
#      la rama "main".
#   2. En GitHub: Settings → Secrets and variables → Actions → New repository
#      secret → nombre VERCEL_DEPLOY_HOOK_URL, valor = la URL del hook.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al Vercel Deploy Hook
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::Falta el secret VERCEL_DEPLOY_HOOK_URL (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}")
          echo "Vercel respondió: $status"
          if [ "$status" -ge 300 ]; then
            echo "::error::El Deploy Hook respondió $status — el rebuild no se disparó."
            exit 1
          fi
